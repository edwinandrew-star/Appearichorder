<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Appearich</title>
<style>
  body {
    margin: 0; height: 100vh; background: #000; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  h1 { color: #d4af37; font-size: 1.4rem; margin-bottom: 8px; }
  p { color: #aaa; font-size: 0.9rem; max-width: 320px; }
  button {
    margin-top: 20px; background: #d4af37; color: #000; border: none;
    padding: 12px 24px; border-radius: 50px; font-weight: 800; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>You're offline</h1>
  <p>No connection right now. Anything you've already loaded still works — new pages need a connection.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
