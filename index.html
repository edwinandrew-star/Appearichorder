<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appearich</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .card {
      background: #0d0d0d;
      border: 1px solid #222222;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
      width: 100%;
      max-width: 380px;
      
      /* Logo Pop-Up Animation */
      animation: popup 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popup {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .logo-container {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
    }

    .logo {
      width: 150px;
      height: auto;
      object-fit: contain;
      /* Eliminates square border artifacts on black backgrounds */
      mix-blend-mode: screen; 
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
    }

    h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #aaaaaa;
      font-size: 0.85rem;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      background: #181818;
      border: 1px solid #333333;
      border-radius: 8px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #e0e0e0;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .toggle-text {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #888888;
    }

    .toggle-text a {
      color: #ffffff;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="images/appearich-logo.png" alt="Appearich Logo" class="logo">
    </div>
    
    <h2 id="formTitle">Create Account</h2>
    
    <form id="authForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>
      <button type="submit" id="submitBtn" class="btn">Register</button>
    </form>

    <div class="toggle-text" id="toggleContainer">
      <span id="toggleQuestion">Already have an account?</span> 
      <a id="toggleLink">Sign In</a>
    </div>
  </div>

  <script>
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const toggleQuestion = document.getElementById("toggleQuestion");
    const toggleLink = document.getElementById("toggleLink");
    const authForm = document.getElementById("authForm");

    let isRegisterMode = true;

    // 1. Initial Routing Check on Load
    document.addEventListener("DOMContentLoaded", () => {
      const hasAccount = localStorage.getItem("hasAccount") === "true";
      const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";

      // If user has an account and is logged in -> jump straight to home.html
      if (hasAccount && isLoggedIn) {
        window.location.href = "home.html";
        return;
      }

      // If user already has an account but logged out -> show Login mode
      if (hasAccount) {
        setLoginMode();
      } else {
        // First time visitor without account -> default to Create Account mode
        setRegisterMode();
      }
    });

    // 2. UI Switchers
    function setRegisterMode() {
      isRegisterMode = true;
      formTitle.textContent = "Create Account";
      submitBtn.textContent = "Register";
      toggleQuestion.textContent = "Already have an account?";
      toggleLink.textContent = "Sign In";
    }

    function setLoginMode() {
      isRegisterMode = false;
      formTitle.textContent = "Sign In";
      submitBtn.textContent = "Log In";
      toggleQuestion.textContent = "Don't have an account?";
      toggleLink.textContent = "Create Account";
    }

    toggleLink.addEventListener("click", () => {
      if (isRegisterMode) {
        setLoginMode();
      } else {
        setRegisterMode();
      }
    });

    // 3. Form Submission Handling
    authForm.addEventListener("submit", (e) => {
      e.preventDefault();
      
      // Store persistent account flag and login state
      localStorage.setItem("hasAccount", "true");
      localStorage.setItem("isLoggedIn", "true");
      
      // Redirect to home screen
      window.location.href = "home.html";
    });
  </script>

</body>
</html>
