<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APPEARICH - Premium Service & Scent Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ==========================================================================
       THEME VARIABLES & GLOBAL RESET
       ========================================================================== */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --card-bg-sub: #f1f3f5;
      --card-border: #e9ecef;
      --text-main: #111111;
      --text-sub: #666666;
      --accent-gold: #d4af37;
      --accent-gold-light: rgba(212, 175, 55, 0.15);
      --nav-bg: #ffffff;
      --nav-border: #e9ecef;
      --input-bg: #f1f3f5;
      --input-border: #ced4da;
      --modal-bg: #ffffff;
      --overlay-bg: rgba(0, 0, 0, 0.5);
      --shadow-color: rgba(0, 0, 0, 0.08);
    }
    [data-theme="dark"] {
      --bg-color: #0d0d0d;
      --card-bg: #181818;
      --card-bg-sub: #141414;
      --card-border: #282828;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-gold: #FFD700;
      --accent-gold-light: rgba(255, 215, 0, 0.15);
      --nav-bg: #111111;
      --nav-border: #222222;
      --input-bg: #000000;
      --input-border: #333333;
      --modal-bg: #141414;
      --overlay-bg: rgba(0, 0, 0, 0.85);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 75px;
      padding-bottom: 80px;
      overflow-x: hidden;
    }
    .app-screen {
      display: none;
      width: 100%;
      max-width: 480px;
      min-height: calc(100vh - 155px);
      padding: 20px 16px;
      flex-direction: column;
      position: relative;
      animation: fadeIn 0.3s ease-in-out;
    }
    .app-screen.active { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .app-header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      height: 70px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-color);
      border-bottom: 1px solid var(--card-border);
      z-index: 1500;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      background: var(--card-bg-sub);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }
    .brand-logo-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-logo-img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 1.2rem;
      border: 2px solid var(--accent-gold);
    }
    .brand-name { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; }
    .brand-name .logo-appea { color: var(--text-main); }
    .brand-name .logo-rich { color: var(--accent-gold); }
    
    .theme-toggle-btn {
      background: var(--card-bg-sub);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Modal Styling */
    .modal-overlay {
      display: flex;
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-box {
      width: 90%;
      max-width: 400px;
      background: var(--modal-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px var(--shadow-color);
    }
    .delivery-fee-box {
      background: var(--card-bg-sub);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }
    .fee-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .special-fee-tag {
      background: #e11d48;
      color: #ffffff;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      text-align: center;
    }
    .standard-fee-tag {
      background: var(--accent-gold);
      color: #000;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      text-align: center;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <button class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="brand-logo-wrap">
        <div class="brand-logo-img">A</div>
        <span class="brand-name"><span class="logo-appea">APPEA</span><span class="logo-rich">RICH</span></span>
      </div>
    </div>
    <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
  </header>

  <div class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">Order Summary</h3>
      
      <!-- Delivery Fee Breakdown Box -->
      <div class="delivery-fee-box">
        <div class="fee-row">
          <span><i class="fa-solid fa-clock" style="color:var(--accent-gold);"></i> Delivery Time:</span>
          <strong id="currentTimeDisplay">--:--</strong>
        </div>
        <div id="deliveryFeeBadge" class="standard-fee-tag">Checking time...</div>
      </div>

      <button class="submit-btn" onclick="submitFoodOrder()">Submit Order to WhatsApp</button>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }

    // Time-Based Delivery Fee Helper (11:00 PM to 6:00 AM Cutoff)
    function calculateDeliveryFee() {
      const now = new Date();
      const currentHour = now.getHours(); // Returns 0 - 23
      const feeBadge = document.getElementById('deliveryFeeBadge');
      const timeDisplay = document.getElementById('currentTimeDisplay');

      timeDisplay.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Special Fee applies late night / early morning (11:00 PM / 23:00 to 6:00 AM)
      const isNightTime = (currentHour >= 23 || currentHour < 6);

      if (isNightTime) {
        feeBadge.className = 'special-fee-tag';
        feeBadge.innerText = 'Special Night Fee Applicable (11:00 PM - 6:00 AM)';
      } else {
        feeBadge.className = 'standard-fee-tag';
        feeBadge.innerText = 'Standard Daytime Delivery Fee';
      }
    }

    function submitFoodOrder() {
      const now = new Date();
      const currentHour = now.getHours();
      
      // Special Fee applies late night / early morning (11:00 PM to 6:00 AM)
      const isNightTime = (currentHour >= 23 || currentHour < 6);
      
      const feeStatus = isNightTime 
        ? "Special Night Delivery Fee (After 11:00 PM)" 
        : "Standard Daytime Delivery Fee";

      const currentTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      alert(`Order submitted!\nTime: ${currentTime}\nDelivery Fee Status: ${feeStatus}`);
    }

    // Run automatically when DOM content loads
    window.addEventListener('DOMContentLoaded', () => {
      calculateDeliveryFee();
    });
  </script>
</body>
</html>
