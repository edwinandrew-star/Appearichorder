<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appearich">
    
    <title>Appearich</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        .app { width: 100vw; height: 100vh; background: #000000; position: relative; overflow: hidden; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; }
        .screen.active { display: flex; }
        
        .logo { display: flex; justify-content: center; align-items: center; width: 100%; padding: 25px; animation: popup 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .logo img { width: 100%; max-width: 280px; height: auto; object-fit: contain; cursor: pointer; }
        
        @keyframes popup { 
            0% { opacity: 0; transform: scale(0.8) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
    </style>
</head>

<body>
    <div class="app">
        <div id="logoScreen" class="screen active">
            <div class="logo">
                <img src="images/appearich-logo.png" alt="Appearich Logo" onclick="window.location.href='login.html'">
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            setTimeout(function () {
                window.location.href = 'login.html';
            }, 2500);
        };
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
