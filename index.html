<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hot Meals - APPEARICH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ==========================================================================
       THEME VARIABLES & GLOBAL STYLES
       ========================================================================== */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --card-bg-sub: #f1f3f5;
      --card-border: #e9ecef;
      --text-main: #111111;
      --text-sub: #666666;
      --accent-gold: #d4af37;
      --accent-gold-light: rgba(212, 175, 55, 0.15);
      --input-bg: #f1f3f5;
      --input-border: #ced4da;
      --modal-bg: #ffffff;
      --overlay-bg: rgba(0, 0, 0, 0.5);
      --shadow-color: rgba(0, 0, 0, 0.08);
      --whatsapp-green: #25d366;
    }

    [data-theme="dark"] {
      --bg-color: #0d0d0d;
      --card-bg: #181818;
      --card-bg-sub: #141414;
      --card-border: #282828;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-gold: #FFD700;
      --accent-gold-light: rgba(255, 215, 0, 0.15);
      --input-bg: #000000;
      --input-border: #333333;
      --modal-bg: #141414;
      --overlay-bg: rgba(0, 0, 0, 0.85);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body { 
      background: var(--bg-color); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding-bottom: 40px; 
      overflow-x: hidden;
    }

    /* ==========================================================================
       HEADER (CLEAN TOP, WORKING BACK BUTTON)
       ========================================================================== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 12px 16px;
    }
    .back-btn {
      background: var(--card-bg-sub);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      box-shadow: 0 2px 6px var(--shadow-color);
    }
    .brand-title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-sub {
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--text-sub);
      font-weight: 700;
    }
    .brand-name {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .brand-name .logo-appea { color: var(--text-main); }
    .brand-name .logo-rich { color: var(--accent-gold); }

    .theme-toggle-btn {
      background: var(--card-bg-sub);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }

    .app-screen { 
      width: 100%; 
      max-width: 480px; 
      padding: 12px 16px; 
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       HOT MEALS GRID
       ========================================================================== */
    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meals-catalog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 30px;
    }

    .meal-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      cursor: pointer;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 12px var(--shadow-color);
      background-size: cover;
      background-position: center;
      background-color: var(--card-bg-sub);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .meal-card:active { 
      transform: scale(0.98); 
    }
    .meal-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px 12px;
      color: #ffffff;
    }
    .meal-card-title { 
      font-size: 1.05rem; 
      font-weight: 800; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    .meal-card-price { 
      font-size: 0.82rem; 
      color: var(--accent-gold); 
      font-weight: 800; 
      margin-top: 2px; 
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* ==========================================================================
       ORDER MODAL SHEET
       ========================================================================== */
    .modal-overlay {
      display: none; 
      position: fixed; 
      inset: 0;
      background: var(--overlay-bg); 
      backdrop-filter: blur(6px);
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      z-index: 2000;
    }
    .modal-overlay.active { 
      display: flex; 
    }
    .modal-card-box {
      background: var(--modal-bg); 
      border-radius: 24px;
      width: 100%; 
      max-width: 440px; 
      padding: 24px 20px; 
      position: relative;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px var(--shadow-color);
      animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-close-x { 
      position: absolute; 
      top: 18px; 
      right: 20px; 
      font-size: 1.3rem; 
      cursor: pointer; 
      font-weight: 800; 
      color: var(--text-sub); 
    }
    .modal-heading { 
      font-size: 1.3rem; 
      font-weight: 900; 
      text-align: center; 
      color: var(--text-main); 
    }
    .modal-subheading { 
      font-size: 0.88rem; 
      color: var(--accent-gold); 
      text-align: center; 
      font-weight: 800; 
      margin-bottom: 18px; 
      margin-top: 2px;
    }

    .form-section-title { 
      font-size: 0.85rem; 
      font-weight: 800; 
      margin-bottom: 8px; 
      color: var(--text-main); 
    }

    .form-group { 
      margin-bottom: 16px; 
    }
    .form-group input, 
    .form-group textarea {
      width: 100%; 
      background: var(--input-bg);
      border: 1.5px solid var(--input-border); 
      border-radius: 12px;
      padding: 12px; 
      font-size: 0.88rem; 
      outline: none; 
      color: var(--text-main);
    }
    .form-group input:focus, 
    .form-group textarea:focus {
      border-color: var(--accent-gold);
    }
    .form-group textarea { 
      height: 85px; 
      resize: none; 
    }

    .btn-whatsapp-send {
      width: 100%; 
      background: var(--whatsapp-green); 
      color: #ffffff; 
      border: none;
      padding: 14px; 
      border-radius: 12px; 
      font-weight: 800; 
      font-size: 0.95rem;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
  </style>
</head>
<body>

  <!-- CLEAN HEADER WITH WORKING BACK BUTTON -->
  <header class="app-header">
    <a href="index.html" class="back-btn" title="Back to Home">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="brand-title-wrap">
      <span class="brand-sub">DELICIOUS DISHES</span>
      <div class="brand-name">
        <span class="logo-appea">APPEA</span><span class="logo-rich">RICH</span>
      </div>
    </div>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Switch Light/Dark Mode">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <div class="app-screen">

    <div class="section-title">
      <i class="fa-solid fa-utensils" style="color:var(--accent-gold);"></i> Hot Meals Menu
    </div>
    
    <!-- Hot Meals Grid -->
    <div class="meals-catalog-grid">
      
      <!-- Meal 1 -->
      <div class="meal-card" style="background-image: url('images/meal1.jpg');" onclick="openMealOrder('Grilled Chicken Special', '15,000/=')">
        <div class="meal-card-overlay">
          <div class="meal-card-title">Grilled Chicken</div>
          <div class="meal-card-price">15,000/=</div>
        </div>
      </div>

      <!-- Meal 2 -->
      <div class="meal-card" style="background-image: url('images/meal2.jpg');" onclick="openMealOrder('Beef Burger Combo', '12,000/=')">
        <div class="meal-card-overlay">
          <div class="meal-card-title">Beef Burger</div>
          <div class="meal-card-price">12,000/=</div>
        </div>
      </div>

      <!-- Meal 3 -->
      <div class="meal-card" style="background-image: url('images/meal3.jpg');" onclick="openMealOrder('Seafood Pasta', '18,000/=')">
        <div class="meal-card-overlay">
          <div class="meal-card-title">Seafood Pasta</div>
          <div class="meal-card-price">18,000/=</div>
        </div>
      </div>

      <!-- Meal 4 -->
      <div class="meal-card" style="background-image: url('images/meal4.jpg');" onclick="openMealOrder('Custom Hot Plate', 'Varies')">
        <div class="meal-card-overlay">
          <div class="meal-card-title">Custom Order</div>
          <div class="meal-card-price">Describe details</div>
        </div>
      </div>

    </div>

  </div>

  <!-- ORDER MODAL SHEET -->
  <div id="mealOrderModal" class="modal-overlay">
    <div class="modal-card-box">
      <span class="modal-close-x" onclick="closeMealOrder()">&times;</span>
      
      <div class="modal-heading" id="selectedMealTitle">Order Hot Meal</div>
      <div class="modal-subheading" id="selectedMealPrice">Price: 15,000/=</div>

      <!-- Quantity Selection -->
      <div class="form-section-title">1. Quantity:</div>
      <div class="form-group">
        <input type="number" id="mealQuantity" value="1" min="1" placeholder="Enter quantity" />
      </div>

      <!-- Specific instructions / Anything specific field -->
      <div class="form-section-title">2. Anything specific?:</div>
      <div class="form-group">
        <textarea id="mealCustomNotes" placeholder="e.g., Extra spicy, no onions, extra sauce, delivery details, or custom order request..."></textarea>
      </div>

      <!-- Direct WhatsApp Order Button -->
      <button class="btn-whatsapp-send" onclick="sendMealOrderToWhatsApp()">
        <i class="fa-brands fa-whatsapp" style="font-size:1.2rem;"></i> Send Order on WhatsApp
      </button>
    </div>
  </div>

  <script>
    let activeMealName = "";
    let activeMealPrice = "";
    const supportPhone = "255764019027";

    // Theme Toggle Functionality
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const icon = document.querySelector('#themeToggleBtn i');
      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        icon.className = 'fa-solid fa-moon';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        icon.className = 'fa-solid fa-sun';
      }
    }

    // Modal Controls
    function openMealOrder(name, price) {
      activeMealName = name;
      activeMealPrice = price;
      document.getElementById('selectedMealTitle').innerText = name;
      document.getElementById('selectedMealPrice').innerText = `Price: ${price}`;
      document.getElementById('mealQuantity').value = 1;
      document.getElementById('mealCustomNotes').value = "";
      document.getElementById('mealOrderModal').classList.add('active');
    }

    function closeMealOrder() {
      document.getElementById('mealOrderModal').classList.remove('active');
    }

    // Send Order directly to WhatsApp
    function sendMealOrderToWhatsApp() {
      const quantity = document.getElementById('mealQuantity').value || 1;
      const customNotes = document.getElementById('mealCustomNotes').value.trim();

      let formattedMsg = `*NEW HOT MEAL ORDER - APPEARICH*\n\n` +
                         `• *Meal:* ${activeMealName}\n` +
                         `• *Price:* ${activeMealPrice}\n` +
                         `• *Quantity:* ${quantity}\n`;

      if (customNotes !== "") {
        formattedMsg += `• *Specific Requests/Details:* ${customNotes}`;
      } else {
        formattedMsg += `• *Specific Requests:* None`;
      }

      const whatsappUrl = `https://wa.me/${supportPhone}?text=${encodeURIComponent(formattedMsg)}`;
      window.open(whatsappUrl, '_blank');
      closeMealOrder();
    }
  </script>
</body>
</html>
