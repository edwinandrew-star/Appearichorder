<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appearich">
    
    <title>Appearich</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --app-height: 100dvh;
        }

        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            height: var(--app-height);
            overflow: hidden; 
            background: #000000; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        .app { 
            width: 100%; 
            height: 100%; 
            background: #ffffff; 
            position: relative; 
            overflow: hidden; 
        }
        
        .screen { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            display: none; 
            padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px) 24px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        .screen.active { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
        }

        /* 1. Black Splash Screen */
        #logoScreen { 
            background: #000000; 
            z-index: 10;
        }

        .logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img { 
            width: 70%; 
            max-width: 240px; 
            height: auto; 
            object-fit: contain; 
            animation: logoPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes logoPop {
            0% { opacity: 0; transform: scale(0.3); }
            70% { opacity: 1; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Mobile Container Formatting */
        .auth-card, .home-card {
            width: 100%;
            max-width: 400px;
            margin: auto 0; /* Keeps card centered while allowing overflow scroll on small screens */
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111111;
            margin: 0 0 6px 0;
        }

        p {
            font-size: 0.9rem;
            color: #666666;
            margin: 0 0 24px 0;
        }

        .input-group {
            margin-bottom: 16px;
            width: 100%;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Set base font-size to 16px for input elements to prevent iOS auto-zoom */
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #eeeeee;
            border-radius: 14px;
            background: #fdfdfd;
            outline: none;
            transition: border-color 0.2s;
            -webkit-user-select: text;
            user-select: text;
        }

        .input-group input:focus {
            border-color: #111111;
        }

        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            background: #111111; 
            color: #FFD700; 
            border-radius: 16px; 
            font-weight: 800; 
            font-size: 15px; 
            margin-top: 8px; 
            cursor: pointer; 
            transition: opacity 0.15s ease;
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn-secondary {
            background: #f4f4f4;
            color: #111111;
            margin-top: 12px;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666666;
        }

        .auth-toggle span {
            color: #111111;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- 1. SPLASH SCREEN -->
        <div id="logoScreen" class="screen active">
            <div class="logo">
                <img src="images/appearich-logo.png" alt="Appearich Logo">
            </div>
        </div>

        <!-- 2. CREATE ACCOUNT SCREEN -->
        <div id="registerScreen" class="screen">
            <div class="auth-card">
                <h2>Create Account</h2>
                <p>Sign up to get started with Appearich.</p>

                <form onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn">Create Account</button>
                </form>

                <div class="auth-toggle">
                    Already have an account? <span onclick="showScreen('loginScreen')">Sign In</span>
                </div>
            </div>
        </div>

        <!-- 3. LOGIN SCREEN -->
        <div id="loginScreen" class="screen">
            <div class="auth-card">
                <h2>Welcome Back</h2>
                <p>Please enter your details to sign in.</p>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn">Sign In</button>
                </form>

                <div class="auth-toggle">
                    Don't have an account? <span onclick="showScreen('registerScreen')">Create Account</span>
                </div>
            </div>
        </div>

        <!-- 4. HOME SCREEN -->
        <div id="homeScreen" class="screen">
            <div class="home-card">
                <h2>🏠 Home Screen</h2>
                <p>Welcome to Appearich! You are currently logged in.</p>

                <button class="btn btn-secondary" onclick="handleLogout()">Log Out (Reset Account State)</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            setTimeout(function () {
                document.getElementById("logoScreen").classList.remove("active");

                const hasAccount = localStorage.getItem("appearich_has_account");

                if (hasAccount === "true") {
                    document.getElementById("homeScreen").classList.add("active");
                } else {
                    document.getElementById("registerScreen").classList.add("active");
                }
            }, 2000);
        };

        function showScreen(targetScreenId) {
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(targetScreenId).classList.add('active');
        }

        function handleRegister(event) {
            event.preventDefault();
            localStorage.setItem("appearich_has_account", "true");
            showScreen("homeScreen");
        }

        function handleLogin(event) {
            event.preventDefault();
            localStorage.setItem("appearich_has_account", "true");
            showScreen("homeScreen");
        }

        function handleLogout() {
            localStorage.removeItem("appearich_has_account");
            showScreen("registerScreen");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
