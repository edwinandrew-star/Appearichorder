<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appearich">
    
    <title>Appearich - Sign In</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Force body to be full screen */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f2f5; }
        
        /* App container fills the entire viewport */
        .app { 
            width: 100vw; height: 100vh; background: white; 
            padding: 40px; display: flex; flex-direction: column; 
            justify-content: center; box-sizing: border-box;
        }
        
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #000; color: #FFD700; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hide { display: none; }
        .link { text-align: center; margin-top: 20px; cursor: pointer; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="app">
    <h1 id="formTitle" style="text-align: center; margin-bottom: 20px;">Sign In</h1>
    
    <input id="email" type="email" placeholder="Email Address">
    
    <div id="signupFields" class="hide">
        <input id="fullname" placeholder="Full Name">
        <input id="phone" type="tel" placeholder="Phone Number">
    </div>

    <input id="password" type="password" placeholder="Password">

    <div id="confirm" class="hide">
        <input id="confirmPassword" type="password" placeholder="Confirm Password">
    </div>

    <button class="btn" onclick="submitForm()">Continue</button>

    <div class="link" onclick="toggleForm()" id="switch">Create Account</div>
</div>

<script>
    const supabaseClient = supabase.createClient(
        'https://eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1ZHF1YmJnbHdwaGZ4YXZpcXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NjcyNTUsImV4cCI6MjA5ODA0MzI1NX0.7pRbRqz9-5gN8SG_ALn5ecHOWQofykPvhbrE2HQROCE' );

    let signup = false;

    function toggleForm() {
        signup = !signup;
        document.getElementById("formTitle").innerText = signup ? "Create Account" : "Sign In";
        document.getElementById("signupFields").classList.toggle("hide", !signup);
        document.getElementById("confirm").classList.toggle("hide", !signup);
        document.getElementById("switch").innerText = signup ? "Already have an account?" : "Create Account";
    }

    async function submitForm() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (signup) {
            const name = document.getElementById("fullname").value;
            const phone = document.getElementById("phone").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (password !== confirm) return alert("Passwords don't match");
            if (!name || !phone) return alert("Please fill in all fields");

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: { 
                    data: { display_name: name, phone_number: phone }
                }
            });

            if (error) {
                alert("Signup Error: " + error.message);
            } else {
                alert("Success! Welcome.");
                location.replace("home.html");
            }
        } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email: email, 
                password: password 
            });
            
            if (error) {
                alert("Login Error: " + error.message);
            } else {
                location.replace("home.html");
            }
        }
    }
</script>

</body>
</html>
