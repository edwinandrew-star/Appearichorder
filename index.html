<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hostel Food Express">
  
  <title>Hostel Food Express</title>
  <style>
    /* Force body to be full screen matching Appearich design */
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000000; 
    }

    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }

    /* App container */
    .app { 
      width: 100vw; 
      height: 100vh; 
      background: #ffffff; 
      position: relative; 
      overflow: hidden; 
    }

    .screen { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 25px; 
      overflow-y: auto; 
    }

    .card { 
      background: #ffffff; 
      padding: 15px 5px; 
      width: 100%; 
      margin-bottom: 20px; 
    }

    .card h1 { 
      font-size: 26px; 
      text-align: center; 
      color: #111111; 
      font-weight: 800; 
      margin-bottom: 8px; 
    }

    .subtitle { 
      font-size: 14px; 
      color: #555555; 
      text-align: center; 
      margin-bottom: 25px; 
      line-height: 1.5; 
    }

    .section-title { 
      font-size: 13px; 
      font-weight: 700; 
      color: #111111; 
      margin: 20px 0 10px 0; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      border-bottom: 2px solid #FFD700; 
      padding-bottom: 4px; 
      width: fit-content; 
    }

    label { 
      font-size: 13px; 
      font-weight: 700; 
      color: #111111; 
      display: block; 
      margin: 16px 0 6px 0; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }

    input, textarea { 
      width: 100%; 
      padding: 14px; 
      background: #fdfdfd; 
      border: 1px solid #e5e5e5; 
      border-radius: 14px; 
      font-size: 14px; 
      color: #333333; 
      outline: none; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); 
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus { 
      border-color: #FFD700; 
      background: #ffffff; 
    }

    .magic-box { 
      background: linear-gradient(135deg, #111111 0%, #222222 100%); 
      padding: 20px; 
      border-radius: 18px; 
      margin: 15px 0; 
      color: #eeeeee; 
      text-align: center; 
    }

    .magic-box small { 
      font-size: 12px; 
      color: #aaaaaa; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      display: block; 
      margin-bottom: 4px; 
    }

    .magic-box strong { 
      font-size: 28px; 
      font-weight: 800; 
      color: #FFD700; 
      display: block; 
      margin: 6px 0; 
      letter-spacing: 1px; 
    }

    .magic-box span { 
      font-size: 13px; 
      color: #dddddd; 
      font-weight: 600; 
    }

    .btn { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      background: #111111; 
      color: #FFD700; 
      border-radius: 18px; 
      font-weight: 800; 
      font-size: 16px; 
      margin-top: 24px; 
      cursor: pointer; 
      transition: transform 0.1s ease; 
    }

    .btn-alt { 
      background: #FFD700; 
      color: #111111; 
    }

    .btn:active { 
      transform: scale(0.98); 
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="screen">
      <div class="card">
        <h1>⚡ Hostel Express</h1>
        <div class="subtitle">Agiza chakula kwa haraka na kitaletwa mpaka chumbani kwako.</div>

        <!-- STEP 1: ORDER FORM -->
        <div id="step-1">
          <div class="section-title">✨ Weka Order Yako</div>
          
          <form id="orderForm">
            <label>Jina Lako (Your Name)</label>
            <input type="text" id="name" placeholder="John Doe" required>

            <label>Namba Yako ya Simu (Delivery Phone)</label>
            <input type="tel" id="contactPhone" placeholder="07XXXXXXXX" required>

            <label>Hostel Block & Room Number</label>
            <input type="text" id="location" placeholder="Block B, Room 204" required>

            <label>Agizo Lako (Food Description)</label>
            <textarea id="items" rows="3" placeholder="2 Chips Mayai, Pepsi 1 baridi" required></textarea>

            <label>Kiasi Cha Kutuma (TZS)</label>
            <input type="number" id="amount" placeholder="7000" required>

            <button type="submit" class="btn btn-alt">ENDELEA KWENYE MALIPO ➔</button>
          </form>
        </div>

        <!-- STEP 2: LIPA NAMBA & ACCOUNT NAME ENTRY -->
        <div id="step-2" style="display: none;">
          <div class="section-title">💳 Lipia Malipo</div>

          <div class="magic-box">
            <small>LIPA KUPITIA TIGO / M-PESA / AIRTEL</small>
            <strong>5544321</strong>
            <span>HOSTEL EXPRESS SERVICES</span>
          </div>

          <label>Jina Lililopo Kwenye Akaunti Uliyolipa Nayo</label>
          <input type="text" id="payerName" placeholder="Mfano: Amina Said" required>

          <button type="button" onclick="sendToWhatsApp()" class="btn btn-alt">
            TUMA ORDER KWENYE WHATSAPP 💬
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const ADMIN_WHATSAPP_NUMBER = "255764519027"; 

    let orderData = {};

    // STEP 1 Submission
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();

      orderData = {
        name: document.getElementById('name').value,
        contactPhone: document.getElementById('contactPhone').value,
        location: document.getElementById('location').value,
        items: document.getElementById('items').value,
        amount: document.getElementById('amount').value
      };

      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    });

    // STEP 2 Submission (Open WhatsApp with formatted message)
    function sendToWhatsApp() {
      const payerName = document.getElementById('payerName').value;

      if (!payerName) {
        alert("Tafadhali jaza jina lililopo kwenye akaunti uliyolipa nayo!");
        return;
      }

      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateString = now.toLocaleDateString('sw-TZ');

      // Build structured text message
      const message = `🚨 *NEW FOOD ORDER* 🚨\n\n` +
        `📅 *Tarehe:* ${dateString} (${timeString})\n` +
        `👤 *Jina:* ${orderData.name}\n` +
        `📞 *Simu:* ${orderData.contactPhone}\n` +
        `📍 *Eneo:* ${orderData.location}\n` +
        `🍔 *Agizo:* ${orderData.items}\n` +
        `💰 *Kiasi:* TZS ${Number(orderData.amount).toLocaleString()}\n` +
        `💳 *Akaunti Iliyolipa:* ${payerName}\n\n` +
        `*Tafadhali thibitisha na anza kuandaa!*`;

      // Redirect to WhatsApp
      const whatsappUrl = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.location.href = whatsappUrl;
    }
  </script>
</body>
</html>
