<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appearich">
    
    <title>Appearich</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Force body to be the full screen */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* App container now fills the entire viewport */
        .app { width: 100vw; height: 100vh; background: #ffffff; position: relative; overflow: hidden; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: none; padding: 25px; overflow-y: auto; }
        .screen.active { display: flex; flex-direction: column; justify-content: flex-start; }
        #logoScreen { background: #000000; justify-content: center; align-items: center; }
        .logo { display: flex; justify-content: center; align-items: center; width: 100%; }
        .logo img { width: 100%; max-width: 280px; height: auto; object-fit: contain; }
        .card { background: #ffffff; padding: 15px 5px; width: 100%; margin-bottom: 20px; }
        .card h1 { font-size: 26px; text-align: center; color: #111111; font-weight: 800; margin-bottom: 12px; }
        .subtitle { font-size: 14px; color: #555555; text-align: center; margin-bottom: 25px; line-height: 1.5; }
        .section-title { font-size: 13px; font-weight: 700; color: #111111; margin: 24px 0 10px 0; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 2px solid #FFD700; padding-bottom: 4px; width: fit-content; }
        .feature { animation: popup .6s cubic-bezier(0.25, 1, 0.5, 1) forwards; background: #fdfdfd; padding: 16px; margin: 12px 0; border-radius: 18px; font-size: 14px; color: #333333; border-left: 4px solid #FFD700; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); }
        .magic-box { background: linear-gradient(135deg, #111111 0%, #222222 100%); padding: 20px; border-radius: 18px; margin: 15px 0; color: #eeeeee; }
        .magic-box blockquote { font-weight: 700; color: #FFD700; border-left: 3px solid #FFD700; padding-left: 10px; }
        .btn { width: 100%; padding: 18px; border: none; background: #111111; color: #FFD700; border-radius: 18px; font-weight: 800; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .btn-alt { background: #FFD700; color: #111111; }
        @keyframes popup { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <div class="app">
        <div id="logoScreen" class="screen active">
            <div class="logo">
                <img src="images/appearich-logo.png" alt="Appearich Logo">
            </div>
        </div>
    <script>
        window.onload = function () {
            setTimeout(function () {
                document.getElementById("logoScreen").classList.remove("active")
            };
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
