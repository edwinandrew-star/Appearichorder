<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Splash Screen Overlay */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Pure black background matching your logo backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        /* Logo Pop Animation */
        .splash-logo {
            width: 120px;
            height: auto;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            70% {
                transform: scale(1.05);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Fade class added by JS */
        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* White Background Login Container */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff; /* Clean white background */
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .login-card h2 {
            font-size: 26px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            outline: none;
            background-color: #f9f9f9;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-group input:focus {
            border-color: #000000;
            background-color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #000000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- App Splash Screen -->
    <div id="splash-screen">
        <!-- Replace src with your image asset location -->
        <img src="images/heroo-ai.jpg" alt="Logo" class="splash-logo">
    </div>

    <!-- Login Screen -->
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in.</p>

            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Keep splash screen visible for 1.8 seconds, then smooth fade out
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
            }, 1800);
        });
    </script>
</body>
</html>
