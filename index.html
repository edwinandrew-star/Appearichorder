<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Appearich</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/appearich-logo1.png">

  <!-- FontAwesome & Supabase SDK -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================================================
       DARK-THEME PREMIUM BASE STYLES (#000000)
       ========================================================================== */
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-bg-sub: #1a1a1a;
      --card-border: #282828;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-gold: #d4af37;
      --accent-gold-light: rgba(212, 175, 55, 0.15);
      --nav-bg: #000000;
      --nav-border: #222222;
      --input-bg: #0a0a0a;
      --input-border: #333333;
      --modal-bg: #121212;
      --overlay-bg: rgba(0, 0, 0, 0.85);
      --shadow-color: rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* SPLASH SCREEN */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    #splash-screen img {
      width: 180px;
      height: auto;
      object-fit: contain;
      background: transparent;
    }

    /* APP CONTAINER & SCREENS */
    .app-screen {
      display: none;
      width: 100%;
      max-width: 480px;
      min-height: calc(100vh - 150px);
      padding: 90px 16px 80px 16px;
      flex-direction: column;
      position: relative;
      animation: fadeIn 0.3s ease-in-out;
    }
    .app-screen.active { display: flex; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER */
    .app-header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      height: 70px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-color);
      border-bottom: 1px solid var(--card-border);
      z-index: 1500;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand-logo-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-logo-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    .brand-name { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.5px; color: var(--text-main); }

    /* AUTH SCREEN */
    #screen-auth {
      padding-top: 40px;
      justify-content: center;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px var(--shadow-color);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .auth-tab-btn.active {
      color: var(--accent-gold);
      border-bottom-color: var(--accent-gold);
    }

    /* FORM STYLES */
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-gold); }
    
    .btn-primary {
      width: 100%;
      background: var(--accent-gold);
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-logout {
      background: #221111;
      color: #ff5555;
      border: 1px solid #442222;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 30px;
    }

    /* HERO BANNER */
    .hero-banner {
      width: 100%;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(0, 0, 0, 0.9) 100%);
      padding: 20px;
      border: 1px solid var(--card-border);
      margin-bottom: 24px;
    }
    .hero-greeting { font-size: 1.5rem; font-weight: 800; color: #ffffff; }
    .hero-tagline { font-size: 0.85rem; color: var(--accent-gold); margin-top: 4px; }

    /* CARDS & GRIDS */
    .offerings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .offer-card {
      background: var(--card-bg);
      border-radius: 18px;
      height: 140px;
      border: 1.5px solid var(--card-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px;
    }
    .offer-card-title { font-size: 1.1rem; font-weight: 800; color: #ffffff; }
    .offer-card-desc { font-size: 0.72rem; color: var(--accent-gold); margin-top: 2px; }

    /* ORDER TRACKING CARDS */
    .order-card-track {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .track-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--card-border); }
    .order-id { font-size: 0.85rem; font-weight: 800; color: var(--accent-gold); }
    .status-badge { font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; background: rgba(212,175,55,0.15); color: var(--accent-gold); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-item.active { color: var(--accent-gold); }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <img src="images/appearich-logo.png" alt="Appearich Splash Logo">
  </div>

  <!-- FIXED HEADER -->
  <header class="app-header" id="main-header" style="display: none;">
    <div class="header-left">
      <div class="brand-logo-wrap">
        <img src="images/appearich-logo1.png" alt="Appearich" class="brand-logo-img">
        <div class="brand-name">Appearich</div>
      </div>
    </div>
  </header>

  <!-- AUTHENTICATION SCREEN -->
  <div id="screen-auth" class="app-screen">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn" onclick="toggleAuthMode('login')">Login</button>
        <button class="auth-tab-btn" id="tab-register-btn" onclick="toggleAuthMode('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" required placeholder="Enter username (e.g. Edwin)">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" required placeholder="Enter email address">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" required placeholder="Choose a password">
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="app-screen">
    <div class="hero-banner">
      <div class="hero-greeting" id="userGreeting">Welcome, User</div>
      <div class="hero-tagline">Appear Rich — Premium Service & Scent Hub</div>
    </div>

    <div style="margin-bottom: 12px; font-weight: 800; color: var(--text-main);">Our Offerings</div>
    <div class="offerings-grid">
      <div class="offer-card" onclick="openOrderForm('Hot Meals')">
        <div class="offer-card-title">Hot Meals</div>
        <div class="offer-card-desc">Fastest Sourced Delivery</div>
      </div>
      <div class="offer-card" onclick="openOrderForm('Luxury Fragrances')">
        <div class="offer-card-title">Perfumes</div>
        <div class="offer-card-desc">Premium Scent Hub</div>
      </div>
    </div>

    <!-- Quick WhatsApp Order Box -->
    <div class="auth-card" style="margin-top: 10px;">
      <h3 style="margin-bottom: 12px; font-size: 1rem; color: var(--accent-gold);">Create Instant Order</h3>
      <form id="order-form" onsubmit="handlePlaceOrder(event)">
        <div class="form-group">
          <label>Products / Items Required</label>
          <input type="text" id="order-products" required placeholder="e.g. 1x Signature Perfume 50ml, 2x Chipsi Mayai">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="order-phone" required placeholder="e.g. 0764519027">
        </div>
        <div class="form-group">
          <label>Delivery Location</label>
          <input type="text" id="order-location" required placeholder="e.g. Block C, Room 104">
        </div>
        <div class="form-group">
          <label>Delivery Instructions (Optional)</label>
          <textarea id="order-instructions" rows="2" placeholder="Any special notes..."></textarea>
        </div>
        <div class="form-group">
          <label>Estimated Total Price (TZS)</label>
          <input type="number" id="order-total" required placeholder="e.g. 25000">
        </div>
        <button type="submit" class="btn-primary" style="background:#25D366; color:#ffffff;">
          <i class="fa-brands fa-whatsapp"></i> Send Order via WhatsApp
        </button>
      </form>
    </div>

    <!-- Active & Past Orders -->
    <div style="margin-top: 24px; margin-bottom: 12px; font-weight: 800;">Your Saved Orders</div>
    <div id="orders-container"></div>

    <button onclick="handleLogout()" class="btn-logout">Logout</button>
  </div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav" id="main-nav" style="display: none;">
    <button class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="alert('Feature active in Home dashboard')">
      <i class="fa-solid fa-receipt"></i>
      <span>Orders</span>
    </button>
  </nav>

  <!-- CLIENT SCRIPTS & SUPABASE SYNC -->
  <script>
    // 1. SUPABASE INITIALIZATION
    const SUPABASE_URL = 'https://zudqubbglwphfxaviqsg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1ZHF1YmJnbHdwaGZ4YXZpcXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NjcyNTUsImV4cCI6MjA5ODA0MzI1NX0.7pRbRqz9-5gN8SG_ALn5ecHOWQofykPvhbrE2HQROCE';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserProfile = null;
    let localOrders = [];

    // 2. INDEXEDDB / LOCAL STORAGE ENGINE
    const StorageEngine = {
      saveOrders: (orders) => localStorage.setItem('appearich_orders', JSON.stringify(orders)),
      getOrders: () => JSON.parse(localStorage.getItem('appearich_orders') || '[]'),
      saveProfile: (profile) => localStorage.setItem('appearich_user_profile', JSON.stringify(profile)),
      getProfile: () => JSON.parse(localStorage.getItem('appearich_user_profile') || 'null')
    };

    // 3. APP LIFECYCLE & SESSION INIT
    window.addEventListener('DOMContentLoaded', async () => {
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        navigator.register('/service-worker.js').catch(err => console.log('SW Registration failed', err));
      }

      // Hide splash screen after 2.5 seconds
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
      }, 2500);

      // Check Active Supabase Session
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await fetchAndApplyUserProfile(session.user);
        showHomeScreen();
      } else {
        showAuthScreen();
      }

      // Online Sync Event
      window.addEventListener('online', syncLocalOrdersWithSupabase);
    });

    // 4. AUTHENTICATION LOGIC
    function toggleAuthMode(mode) {
      if (mode === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('tab-login-btn').classList.add('active');
        document.getElementById('tab-register-btn').classList.remove('active');
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('tab-register-btn').classList.add('active');
        document.getElementById('tab-login-btn').classList.remove('active');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { username: username } }
      });

      if (error) {
        alert("Registration failed: " + error.message);
        return;
      }

      if (data.user) {
        // Save user profile metadata into profiles table
        await supabase.from('profiles').upsert({ id: data.user.id, username: username });
        currentUserProfile = { username, email };
        StorageEngine.saveProfile(currentUserProfile);
        alert("Registration successful!");
        showHomeScreen();
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Login failed: " + error.message);
        return;
      }

      if (data.user) {
        await fetchAndApplyUserProfile(data.user);
        showHomeScreen();
      }
    }

    async function fetchAndApplyUserProfile(user) {
      let username = user.user_metadata?.username;
      
      if (!username) {
        const { data } = await supabase.from('profiles').select('username').eq('id', user.id).single();
        if (data) username = data.username;
      }

      currentUserProfile = {
        id: user.id,
        username: username || 'User',
        email: user.email
      };

      StorageEngine.saveProfile(currentUserProfile);
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      localStorage.removeItem('appearich_user_profile');
      showAuthScreen();
    }

    // 5. VIEW TOGGLES
    function showAuthScreen() {
      document.getElementById('screen-auth').classList.add('active');
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('main-header').style.display = 'none';
      document.getElementById('main-nav').style.display = 'none';
    }

    function showHomeScreen() {
      document.getElementById('screen-auth').classList.remove('active');
      document.getElementById('screen-home').classList.add('active');
      document.getElementById('main-header').style.display = 'flex';
      document.getElementById('main-nav').style.display = 'flex';

      const profile = currentUserProfile || StorageEngine.getProfile();
      document.getElementById('userGreeting').innerText = `Welcome, ${profile?.username || 'User'}`;
      
      loadOrders();
    }

    // 6. ORDER HANDLING & WHATSAPP GENERATION
    async function handlePlaceOrder(e) {
      e.preventDefault();
      const profile = currentUserProfile || StorageEngine.getProfile();
      const products = document.getElementById('order-products').value.trim();
      const phone = document.getElementById('order-phone').value.trim();
      const location = document.getElementById('order-location').value.trim();
      const instructions = document.getElementById('order-instructions').value.trim() || 'None';
      const total = document.getElementById('order-total').value.trim();

      const orderId = 'APR-' + Math.floor(100000 + Math.random() * 900000);
      const dateStr = new Date().toLocaleDateString();
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const newOrder = {
        order_id: orderId,
        user_id: profile?.id || null,
        username: profile?.username || 'Customer',
        phone: phone,
        products: products,
        location: location,
        instructions: instructions,
        total: total,
        date: dateStr,
        time: timeStr,
        status: 'Pending'
      };

      // 1. Save Locally
      localOrders.unshift(newOrder);
      StorageEngine.saveOrders(localOrders);
      renderOrdersUI();

      // 2. Save in Supabase Remote
      if (navigator.onLine) {
        await supabase.from('orders').insert([newOrder]);
      }

      // 3. Format WhatsApp Message Payload
      const waMsg = `🛍️ *NEW APPEARICH ORDER*\n` +
        `----------------------------------------\n` +
        `🆔 *Order ID:* ${orderId}\n` +
        `👤 *Customer Username:* ${profile?.username || 'Customer'}\n` +
        `📞 *Phone Number:* ${phone}\n` +
        `📍 *Delivery Location:* ${location}\n` +
        `📝 *Instructions:* ${instructions}\n` +
        `📅 *Date:* ${dateStr}\n` +
        `⏰ *Time:* ${timeStr}\n` +
        `----------------------------------------\n` +
        `🛒 *Products:* ${products}\n` +
        `💰 *Order Total:* ${Number(total).toLocaleString()} TZS\n` +
        `💳 *Payment Method:* Cash / Mobile Confirmation\n` +
        `----------------------------------------`;

      const targetPhone = "255764519027";
      window.open(`https://wa.me/${targetPhone}?text=${encodeURIComponent(waMsg)}`, '_blank');
      document.getElementById('order-form').reset();
    }

    async function loadOrders() {
      localOrders = StorageEngine.getOrders();
      renderOrdersUI();

      if (navigator.onLine && currentUserProfile?.id) {
        const { data } = await supabase.from('orders').select('*').eq('user_id', currentUserProfile.id).order('created_at', { ascending: false });
        if (data && data.length > 0) {
          localOrders = data;
          StorageEngine.saveOrders(localOrders);
          renderOrdersUI();
        }
      }
    }

    function renderOrdersUI() {
      const container = document.getElementById('orders-container');
      if (localOrders.length === 0) {
        container.innerHTML = `<p style="font-size:0.8rem; color:var(--text-sub);">No active orders placed yet.</p>`;
        return;
      }

      container.innerHTML = localOrders.map(o => `
        <div class="order-card-track">
          <div class="track-header">
            <span class="order-id">${o.order_id}</span>
            <span class="status-badge">${o.status || 'Pending'}</span>
          </div>
          <p style="font-size:0.85rem; font-weight:700;">${o.products}</p>
          <p style="font-size:0.78rem; color:var(--text-sub); margin-top:4px;">Total: ${Number(o.total).toLocaleString()} TZS | Date: ${o.date}</p>
        </div>
      `).join('');
    }

    async function syncLocalOrdersWithSupabase() {
      if (!navigator.onLine || !currentUserProfile?.id) return;
      const unsynced = StorageEngine.getOrders();
      if (unsynced.length > 0) {
        await supabase.from('orders').upsert(unsynced);
      }
    }
  </script>
</body>
</html>
