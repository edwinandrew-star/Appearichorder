<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appearich">
    
    <title>Appearich Home</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Force full-screen layout */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; background: #f5f5f5; }
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        
        .container { width: 100%; max-width: 500px; margin: auto; min-height: 100vh; padding-bottom: 90px; }

        /* HEADER */
        .top-header { display:flex; align-items:center; gap:12px; padding:20px; }
        .small-logo { width:55px; height:55px; background:white; padding:6px; border-radius:15px; object-fit:contain; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
        .header-text h2 { font-size:26px; }

        /* WELCOME CARD */
        .welcome-card { background:white; margin:0 20px 25px 20px; border-radius:25px; overflow:hidden; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .welcome-card img { width:100%; height:230px; object-fit:cover; }
        .welcome-content { padding:22px; }
        .welcome-content h1 { font-size:24px; margin-bottom:10px; }
        .welcome-content p { font-size:14px; color:#666; line-height:1.5; }

        /* TOWN CONFIDENCE */
        .assistance-card { background: #ffffff; color: #111111; border-radius:25px; padding:20px; margin:0 20px 25px 20px; box-shadow: 0 4px 12px rgba(0,0,0,.05); border: 1px solid #eef0f2; }
        .assistance-card h3 { color:#000000; margin-bottom:15px; font-size:18px; font-weight: bold; }
        .assistance-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .assist-btn { background:#f9f9f9; border:1px solid #e5e5e5; color:#111111; padding:12px; border-radius:12px; font-size:12px; cursor:pointer; font-weight:bold; transition: all 0.2s ease; }
        .assist-btn:hover { background:#FFD700; color:#000; border-color: #FFD700; }
        
        #assist-form { display:none; margin-top:15px; padding:15px; background:#fff; border:2px solid #FFD700; border-radius:15px; }
        #form-title { color:#000; margin-bottom:10px; font-size:14px; }
        textarea { width:100%; height:60px; margin:10px 0; border:1px solid #ccc; border-radius:8px; padding:10px; }
        .send-btn { width:100%; padding:12px; background:#FFD700; border:none; border-radius:8px; font-weight:bold; cursor:pointer; color:#000; }

        /* CREATIVE CUSTOM ASK BAR SYSTEM */
        .creative-ask-box { margin: 0 20px 25px 20px; background: #ffffff; border-radius: 20px; padding: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.05); border: 1px solid #eef0f2; }
        .ask-bar-wrapper { display: flex; align-items: center; background: #f9f9f9; border: 1px solid #e5e5e5; border-radius: 14px; padding: 6px 12px; gap: 10px; transition: all 0.3s ease; }
        .ask-bar-wrapper:focus-within { box-shadow: 0 0 0 2px #FFD700; background: #ffffff; border-color: #FFD700; }
        .ask-bar-input { flex: 1; background: transparent; border: none; outline: none; color: #111111; font-size: 14px; padding: 10px 4px; }
        .ask-action-panel { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15); }
        .ask-action-panel.reveal { max-height: 70px; opacity: 1; margin-top: 12px; }
        .ask-wa-submit-btn { width: 100%; background: #FFD700; color: #111111; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* DESTINATIONS */
        .section-title { font-size:20px; margin:0 20px 15px 20px; }
        .destinations { display:flex; gap:12px; overflow-x:auto; padding-left:20px; padding-bottom:20px; }
        .destination-card { position:relative; width:160px; min-width:160px; height:200px; overflow:hidden; border-radius:20px; text-decoration:none; flex-shrink:0; }
        .destination-card img { width:100%; height:100%; object-fit:cover; }
        .destination-overlay { position:absolute; bottom:0; width:100%; padding:15px; background: linear-gradient(transparent, rgba(0,0,0,.8)); color:white; }

        /* NAV */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; background:white; display:flex; justify-content:space-around; padding:15px 0; box-shadow:0 -2px 10px rgba(0,0,0,.1); z-index:1000; }
        .nav-item { display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#999; font-size:12px; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color:#FFD700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-header">
            <img src="images/appearich-logo.png" class="small-logo">
            <h2>Appearich</h2>
        </div>

        <div class="welcome-card">
            <img src="images/dar.jpg">
            <div class="welcome-content">
                <h1 id="welcomeName">Welcome Traveler 👋</h1>
                <p>Explore Tanzania with local expertise. Get direct support for your journey.</p>
            </div>
        </div>

        <div class="assistance-card">
            <h3>💡 What do you need help with right now?</h3>
            <div class="assistance-grid">
                <button class="assist-btn" onclick="toggleForm('Directions')">📍 Show Me The Way</button>
                <button class="assist-btn" onclick="toggleForm('Price')">💰 Honest Price Check</button>
                <button class="assist-btn" onclick="toggleForm('Transport')">🚌 Smart Ride Finder</button>
                <button class="assist-btn" onclick="toggleForm('Swahili')">🗣 Speak Local Swahili</button>
            </div>
            <div id="assist-form">
                <h4 id="form-title">Help</h4>
                <textarea id="user-input" placeholder="Type your request..."></textarea>
                <button class="send-btn" onclick="sendToWhatsApp()">Send to WhatsApp</button>
            </div>
        </div>

        <div class="creative-ask-box">
            <div class="ask-bar-wrapper">
                <i class="fas fa-comment-dots search-icon"></i>
                <input type="text" id="customAskInput" class="ask-bar-input" placeholder="Ask anything you want here..." oninput="handleCustomAskTyping()">
            </div>
            <div id="askActionPanel" class="ask-action-panel">
                <button class="ask-wa-submit-btn" onclick="sendCustomAskToWhatsApp()">
                    Send via WhatsApp <i class="fab fa-whatsapp"></i>
                </button>
            </div>
        </div>

        <h2 class="section-title">Popular Destinations</h2>
        <div class="destinations">
            <a href="beaches.html" class="destination-card"><img src="images/beach.jpg"><div class="destination-overlay"><h3>🏖 Beaches</h3></div></a>
            <a href="explore.html" class="destination-card"><img src="images/pugu.jpg"><div class="destination-overlay"><h3>🌳 Hiking</h3></div></a>
            <a href="restaurants.html" class="destination-card"><img src="images/restaurant.jpg"><div class="destination-overlay"><h3>🍽 Restaurants</h3></div></a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item active"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="explore.html" class="nav-item"><i class="fas fa-search"></i><span>Explore</span></a>
        <a href="ai-guide.html" class="nav-item"><i class="fas fa-robot"></i><span>AI Guide</span></a>
        <a href="bookings.html" class="nav-item"><i class="fas fa-briefcase"></i><span>Bookings</span></a>
        <a href="#" class="nav-item" onclick="logoutUser()"><i class="fas fa-user"></i><span>Logout</span></a>
    </div>

    <script>
        const supabaseUrl = 'https://zudqubbglwphfxaviqsg.supabase.co'; 
        const supabaseKey = 'sb_publishable_reXo4QeVKdfE6QCmpPjm7g_wOj2GV0H'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        window.onload = async function() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                location.replace("login.html");
                return;
            }
            if (user.user_metadata?.display_name) {
                document.getElementById("welcomeName").innerText = "Welcome " + user.user_metadata.display_name + " 👋";
            }
        };

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
        }

        let currentTopic = "";
        function toggleForm(t) {
            currentTopic = t;
            document.getElementById('assist-form').style.display = 'block';
            document.getElementById('form-title').innerText = "Assistance: " + t;
            document.getElementById('assist-form').scrollIntoView({behavior:'smooth'});
        }

        function sendToWhatsApp() {
            let t = document.getElementById('user-input').value;
            window.open(`https://wa.me/255764519027?text=${encodeURIComponent('Help with '+currentTopic+': '+t)}`, '_blank');
        }

        function handleCustomAskTyping() {
            const query = document.getElementById("customAskInput").value.trim();
            const panel = document.getElementById("askActionPanel");
            panel.classList.toggle("reveal", query.length > 0);
        }

        function sendCustomAskToWhatsApp() {
            const queryText = document.getElementById("customAskInput").value.trim();
            if (queryText) window.open(`https://wa.me/255764519027?text=${encodeURIComponent(queryText)}`, '_blank');
        }
    </script>
</body>
</html>
