<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appearich">
    
    <title>Appearich</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Force body to be the full screen */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* App container now fills the entire viewport */
        .app { width: 100vw; height: 100vh; background: #000000; position: relative; overflow: hidden; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: none; padding: 25px; overflow-y: auto; }
        .screen.active { display: flex; flex-direction: column; justify-content: flex-start; }
        #logoScreen { background: #000000; justify-content: center; align-items: center; display: flex; }
        .logo { display: flex; justify-content: center; align-items: center; width: 100%; }
        .logo img { width: 100%; max-width: 280px; height: auto; object-fit: contain; }
    </style>
</head>

<body>
    <div class="app">
        <div id="logoScreen" class="screen active">
            <div class="logo">
                <img src="images/appearich-logo.png" alt="Appearich Logo">
            </div>
        </div>
    </div>

    <script>
        // Supabase credentials integrated directly
        const SUPABASE_URL = 'https://zudqubbglwphfxaviqsg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1ZHF1YmJnbHdwaGZ4YXZpcXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NjcyNTUsImV4cCI6MjA5ODA0MzI1NX0.7pRbRqz9-5gN8SG_ALn5ecHOWQofykPvhbrE2HQROCE';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async function () {
            try {
                // Check if an active session exists in Supabase
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                setTimeout(function () {
                    if (session) {
                        // User is logged in, redirect to home screen
                        window.location.href = 'home.html';
                    } else {
                        // No active session, redirect to login screen
                        window.location.href = 'login.html';
                    }
                }, 2000); // 2-second splash screen duration
            } catch (err) {
                console.error('Auth check failed:', err);
                // Fallback to login on error
                setTimeout(function () {
                    window.location.href = 'login.html';
                }, 2000);
            }
        };
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
